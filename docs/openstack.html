<h1 id="deploy-openstack-1">Deploy OpenStack</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-bash"><span class="hljs-comment"># Prepare environment                                                       <img class="emoji" draggable="false" alt="📋" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f4cb.svg" data-marp-twemoji=""/></span>
<span class="hljs-built_in">cat</span> &gt;&gt; ~/.profile &lt;&lt;<span class="hljs-string">&quot;EOF&quot;</span>
<span class="hljs-comment">##############################################################################</span>
<span class="hljs-comment"># openstack vars</span>

<span class="hljs-built_in">export</span> OPENSTACK_DIR=~/openstack
KOLLA_ANSIBLE_RELEASE=20 <span class="hljs-comment"># OS 2025.1</span>
VENV_PATH=~/venv/kolla-ansible-<span class="hljs-variable">$KOLLA_ANSIBLE_RELEASE</span>

<span class="hljs-keyword">if</span> [ -z <span class="hljs-string">&quot;<span class="hljs-variable">$VIRTUAL_ENV</span>&quot;</span> ]
<span class="hljs-keyword">then</span>
  <span class="hljs-built_in">source</span> ~/venv/openstack/bin/activate
<span class="hljs-keyword">fi</span>
<span class="hljs-built_in">export</span> ARA_HOME=<span class="hljs-variable">$VIRTUAL_ENV</span>/lib/python3.12/site-packages/ara


ADMIN_OPENRC_FILE=<span class="hljs-variable">$OPENSTACK_DIR</span>/custom-config/tst/admin-openrc.sh
<span class="hljs-keyword">if</span> [ -f <span class="hljs-variable">$ADMIN_OPENRC_FILE</span> ]
<span class="hljs-keyword">then</span>
  <span class="hljs-built_in">source</span>  <span class="hljs-variable">$ADMIN_OPENRC_FILE</span>
<span class="hljs-keyword">fi</span>

<span class="hljs-built_in">export</span> PATH=~/openstack/bin/:<span class="hljs-variable">$PATH</span>
<span class="hljs-built_in">export</span> PS1=<span class="hljs-string">&quot;[\u@\h \W|\[\e[1;32m\]\$OS_USERNAME.\$OS_PROJECT_NAME\[\e[m\]]\$&quot;</span>
<span class="hljs-built_in">source</span> &lt;(openstack complete)
EOF
</code></pre>

<h1 id="replace-a-network-node">Replace a Network Node</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-bash"><span class="hljs-comment"># <img class="emoji" draggable="false" alt="🔍" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f50d.svg" data-marp-twemoji=""/> Review data stored on the node. Is there anything to backup ?          <img class="emoji" draggable="false" alt="📋" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f4cb.svg" data-marp-twemoji=""/></span>
docker volume <span class="hljs-built_in">ls</span>
<span class="hljs-built_in">du</span> -lhs /var/lib/docker/volumes/*

<span class="hljs-comment"># <img class="emoji" draggable="false" alt="💥" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f4a5.svg" data-marp-twemoji=""/> Break the network03 node</span>
apt remove  docker*  -y
<span class="hljs-built_in">rm</span> -rf  /etc/kolla /var/log/kolla  \
        /etc/systemd/system/kolla* \
        /etc/systemd/system/multi-user.target.wants/kolla-* \
        /etc/docker/daemon.json
umount /var/lib/docker;  wipefs /dev/sdb -a; mkfs.ext4 /dev/sdb
reboot

<span class="hljs-comment"># <img class="emoji" draggable="false" alt="🚚" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f69a.svg" data-marp-twemoji=""/> Redeploy opentack services on network03 from the deployment node</span>
kolla-ansible bootstrap-servers -i inventory/wrx --<span class="hljs-built_in">limit</span> ~network03
kolla-ansible prechecks         -i inventory/wrx --<span class="hljs-built_in">limit</span> ~network03
kolla-ansible pull              -i inventory/wrx --<span class="hljs-built_in">limit</span> ~network03
kolla-ansible reconfigure       -i inventory/wrx --<span class="hljs-built_in">limit</span> ~network03
</code></pre>

<h1 id="replace-a-compute-node">Replace a Compute Node</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-bash"><span class="hljs-comment"># <img class="emoji" draggable="false" alt="🔍" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f50d.svg" data-marp-twemoji=""/> Review data stored on the node. Is there anything to backup ?          <img class="emoji" draggable="false" alt="📋" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f4cb.svg" data-marp-twemoji=""/></span>
docker volume <span class="hljs-built_in">ls</span>
<span class="hljs-built_in">du</span> -lhs /var/lib/docker/volumes/*
docker <span class="hljs-built_in">exec</span> -ti nova_libvirt virsh list  --all

<span class="hljs-comment"># <img class="emoji" draggable="false" alt="🚧" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f6a7.svg" data-marp-twemoji=""/> Drain the openstack compute host</span>
openstack server list --all       --host    compute03
openstack compute service <span class="hljs-built_in">set</span>     --<span class="hljs-built_in">disable</span> compute03 nova-compute
<span class="hljs-keyword">for</span> vm <span class="hljs-keyword">in</span> $(openstack server list --host    compute03 --all-projects -c ID -f value);
<span class="hljs-keyword">do</span>
  <span class="hljs-built_in">echo</span> <span class="hljs-string">&quot;Evacuating VM: <span class="hljs-variable">$vm</span>&quot;</span>
  openstack server migrate --live <span class="hljs-variable">$vm</span>
<span class="hljs-keyword">done</span>
openstack server list --all       --host    compute03

<span class="hljs-comment"># <img class="emoji" draggable="false" alt="💥" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f4a5.svg" data-marp-twemoji=""/> Break the compute03 node</span>
systemctl stop kolla-* docker.service docker.socket
apt remove  docker*  -y
<span class="hljs-built_in">rm</span> -rf  /etc/kolla /var/log/kolla  \
        /etc/systemd/system/kolla* \
        /etc/systemd/system/multi-user.target.wants/kolla-* \
        /etc/docker/daemon.json
<span class="hljs-built_in">cp</span> -<span class="hljs-built_in">pr</span>  /var/lib/docker/volumes ~/
umount  /var/lib/docker;  wipefs /dev/sdb -a; mkfs.ext4 /dev/sdb
reboot

<span class="hljs-comment"># <img class="emoji" draggable="false" alt="🚚" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f69a.svg" data-marp-twemoji=""/> Redeploy opentack services on compute03 from the deployment node</span>
kolla-ansible bootstrap-servers -i inventory/wrx --<span class="hljs-built_in">limit</span> ~compute03
kolla-ansible prechecks         -i inventory/wrx --<span class="hljs-built_in">limit</span> ~compute03
kolla-ansible pull              -i inventory/wrx --<span class="hljs-built_in">limit</span> ~compute03
kolla-ansible reconfigure       -i inventory/wrx --<span class="hljs-built_in">limit</span> ~compute03
</code></pre>

<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-bash"><span class="hljs-comment"># <img class="emoji" draggable="false" alt="📝" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f4dd.svg" data-marp-twemoji=""/> Modify inventory, put the new compute host into the hypervisor section <img class="emoji" draggable="false" alt="📋" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f4cb.svg" data-marp-twemoji=""/></span>

<span class="hljs-comment"># <img class="emoji" draggable="false" alt="🩺" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1fa7a.svg" data-marp-twemoji=""/> check the new host</span>

<span class="hljs-comment"># <img class="emoji" draggable="false" alt="🚚" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f69a.svg" data-marp-twemoji=""/> Deploy opentack services on the new compute host</span>

<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-bash"><span class="hljs-comment"># Download Images                                                           <img class="emoji" draggable="false" alt="📋" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f4cb.svg" data-marp-twemoji=""/></span>
<span class="hljs-keyword">for</span> i <span class="hljs-keyword">in</span>  alma~<span class="hljs-variable">$ALMA_VERSION</span>~<span class="hljs-variable">$ALMA_LINK</span>       \

<span class="hljs-keyword">do</span>

  name=<span class="hljs-variable">${fields[0]}</span>
  version=<span class="hljs-variable">${fields[1]}</span>
  <span class="hljs-built_in">link</span>=<span class="hljs-variable">${fields[2]}</span>

  openstack image create <span class="hljs-string">&quot;<span class="hljs-variable">$name</span>-<span class="hljs-variable">$version</span>&quot;</span>       \
      --file             <span class="hljs-string">&quot;<span class="hljs-variable">$filepath</span>&quot;</span>            \
      --disk-format       qcow2                 \
      --container-format  bare                  \
      --property          os_distro=<span class="hljs-string">&quot;<span class="hljs-variable">$name</span>&quot;</span>     \

      --public
<span class="hljs-keyword">done</span>

<span class="hljs-comment"># check</span>
openstack image list --long
</code></pre>

<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-bash"><span class="hljs-comment"># Set permissions                                                           <img class="emoji" draggable="false" alt="📋" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f4cb.svg" data-marp-twemoji=""/></span>

<span class="hljs-comment"># create permissions for the user</span>

<span class="hljs-comment"># check</span>

</code></pre>

<h1 id="networking-1">Networking</h1>
<h2 id="external-network"><strong>External Network</strong></h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-bash"><span class="hljs-comment"># Create external network (vlan backed)                                     <img class="emoji" draggable="false" alt="📋" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f4cb.svg" data-marp-twemoji=""/></span>
<span class="hljs-comment"># as admin</span>
EXT_NET_VLAN=3010
EXT_NET_NAME=<span class="hljs-string">&quot;shared<span class="hljs-variable">${EXT_NET_VLAN}</span>&quot;</span>
EXT_NET_CIDR=<span class="hljs-string">&#x27;10.30.10.0/24&#x27;</span>
EXT_NET_RANGE=<span class="hljs-string">&#x27;start=10.30.10.192,end=10.30.10.254&#x27;</span>
EXT_NET_GATEWAY=<span class="hljs-string">&#x27;10.30.10.1&#x27;</span>

openstack network create       <span class="hljs-variable">${EXT_NET_NAME}</span>  \
   --provider-physical-network physnet3         \
   --provider-network-type     vlan             \
   --provider-segment          <span class="hljs-variable">${EXT_NET_VLAN}</span>  \
   --external

openstack subnet create  <span class="hljs-variable">${EXT_NET_NAME}</span>-subnet \
    --allocation-pool    <span class="hljs-variable">${EXT_NET_RANGE}</span>       \
    --network            <span class="hljs-variable">${EXT_NET_NAME}</span>        \
    --subnet-range       <span class="hljs-variable">${EXT_NET_CIDR}</span>        \
    --gateway            <span class="hljs-variable">${EXT_NET_GATEWAY}</span>     \
    --no-dhcp
</code></pre>

<h1 id="networking-4">Networking</h1>
<h2 id="how-to-access"><strong>How to access?</strong></h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-bash"><span class="hljs-comment"># Create a config for a vlan interface                                      <img class="emoji" draggable="false" alt="📋" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f4cb.svg" data-marp-twemoji=""/></span>
<span class="hljs-comment"># on the testing node as root</span>
myid=$(<span class="hljs-built_in">cat</span> /etc/env.json  | jq .<span class="hljs-built_in">id</span>)

<span class="hljs-built_in">cat</span> &gt; /etc/netplan/80-vlan.yaml &lt;&lt;<span class="hljs-string">EOF
network:
  version: 2
  vlans:
    xtrn0.3010:
      addresses:
      - &quot;10.30.10.${myid}/24&quot;
      dhcp4: false
      dhcp6: false
      id: 3010
      link: eth3
      link-local: []
EOF</span>

<span class="hljs-built_in">chmod</span> 600 /etc/netplan/80-vlan.yaml

netplan apply
</code></pre>

<h1 id="networking-5">Networking</h1>
<h2 id="how-to-access-1"><strong>How to access ?</strong></h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-bash"><span class="hljs-comment"># copy the ssh key from deployment to testing                               <img class="emoji" draggable="false" alt="📋" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f4cb.svg" data-marp-twemoji=""/></span>
scp ~/.ssh/id_ecdsa* testing.mgmt.wrx.sckt.net:~/.ssh/

<span class="hljs-comment"># assign  floating ips to vms</span>
openstack floating ip  create shared3010
FIP_VM0=$(
  openstack floating ip  create shared3010 -f value -c floating_ip_address
)
openstack server add floating ip vm0 <span class="hljs-variable">$FIP_VM0</span>

FIP_VM1=$(
  openstack floating ip  create shared3010 -f value -c floating_ip_address
)
openstack server add floating ip vm1 <span class="hljs-variable">$FIP_VM1</span>

<span class="hljs-comment"># Review assigned IPs</span>
openstack server list

<span class="hljs-comment"># Allow access to vm0</span>
openstack security group create allow-simple-access
openstack security group rule create allow-simple-access \
  --protocol tcp \
  --dst-port 22 \
  --remote-ip 0.0.0.0/0 \
  --ingress
openstack security group rule create allow-simple-access   \
  --protocol icmp \
  --remote-ip 0.0.0.0/0 \
  --ingress
openstack server add security group vm0 allow-simple-access

<span class="hljs-comment"># You shold be able to connect to VMs from the testing node</span>
ping -c 3 &lt;IP&gt;
ssh -i ~/.ssh/id_ecdsa ubuntu@&lt;IP&gt;
</code></pre>

<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-bash"><span class="hljs-comment"># Create a new VM with an additional volume                                 <img class="emoji" draggable="false" alt="📋" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f4cb.svg" data-marp-twemoji=""/></span>

  --flavor m1.small \
  --key-name mykey \
  --nic net-id=workshop-net \
  --block-device uuid=<span class="hljs-variable">$root_uuid</span>,source_type=volume,destination_type=volume,boot_index=0 \

  --user-data ./user-data.yaml \
  vm2


<span class="hljs-comment"># inspect</span>

openstack volume list

<span class="hljs-comment"># create a new floating ip and attach it to the server</span>
