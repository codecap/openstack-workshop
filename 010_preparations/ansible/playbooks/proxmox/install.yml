---
- hosts: all
  name: Set Prerequisites
  gather_facts: true
  tasks:
    - name: Remove loopback entry for hostname
      ansible.builtin.lineinfile:
        path: /etc/hosts
        regexp: "^127[0-9.]+\\s+{{ansible_facts['hostname']}}"
        state: absent
    - name: Ensure hostname points to default IPv4 address
      ansible.builtin.lineinfile:
        path: /etc/hosts
        regexp: "^.*\\b{{ ansible_facts['hostname'] }}\\b.*"
        line: "{{ ansible_facts['default_ipv4']['address'] }} {{ ansible_facts['fqdn'] }} {{ ansible_facts['hostname'] }}"
        state: present
        backup: true
- hosts: all
  gather_facts: yes
  environment:
    PATH: "/lib/systemd:/usr/lib/systemd:{{ ansible_env.PATH }}"
  roles:
    - role: debops.debops.resources
    - role: debops.debops.ntp
  post_tasks:
    - name: 'Restart nftables'
      service:
        name: nftables
        enabled: true
        state: restarted
    - name: Enable bridge forwarding service
      ansible.builtin.systemd:
        name: wrx-bridge-forwarding.service
        enabled: true
        daemon_reload: true
- hosts: all
  gather_facts: yes
  roles:
    - role: lae.proxmox
