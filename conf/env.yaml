---
# Network Layout

# ID Allacation
#   0  -  15  - network
#  16  -  31 - infra
#  32  - 128 - openstack
# 128  - 160 - ceph


##############################################################################
resolve_conf:
  nameservers:
    - 10.14.0.10
  searchdomains: []
##############################################################################
network_conf:
  ############################################################################
  # Public -> Intranet
  ############################################################################
  public:
    iface:       pblc0
    bridgename:  vimbr0
  ############################################################################
  # Infra
  ############################################################################
  management:
    iface:   mgmt0
    addr:    10.14.0.0/24
  services:
    iface:   srvc0
    addr:    10.34.10.0/24
  ############################################################################
  # openstack
  ############################################################################
  controlplane:
    iface:   cpln0
    addr:    10.20.8.0/24
    domain:  os.wrx.sckt.net
  dataplane:
    iface:   dpln0
    addr:    10.20.9.0/24
  lbmanagement:
    iface:   lmgt0
    addr:    10.20.15.0/24
  external:
    # multiple vlans can be used within this interface (trunk mode)
    iface:   xtrn0
    addr:
  ############################################################################
  # ceph
  ############################################################################
  storage0:
    iface:   strg0
    addr:    10.20.21.0/24
    domain:  strg.wrx.sckt.net
  storage1:
    iface:   strg1
    addr:    10.20.22.0/24

##############################################################################
openstack_network_conf:
  ############################################################################
  # external(vlan)
  ############################################################################
  # flat network
  public:
    iface:   pblc0
    # consulut your provider for ip range
    # addr:
  # vlan networks
  shared3010:
    addr:    10.30.10.0/24
    vlan:    3010
  shared3011:
    addr:    10.30.11.0/24
    vlan:    3011
  shared3012:
    addr:    10.30.12.0/24
    vlan:    3012
##############################################################################
server_conf:
  - hostname:    "dns"
    domain:      "wrx.sckt.net"
    ram:         4096
    cpu:         1
    id:          10
    networks:    [management, services]
    netaddr:     auto
    disks:       [8]
    proxy:       yes
  - hostname:    "registry"
    domain:      "wrx.sckt.net"
    ram:         8192
    cpu:         2
    id:          17
    networks:    [management, services]
    netaddr:     auto
    disks:       [128]
  - hostname:    "proxy"
    domain:      "wrx.sckt.net"
    ram:         4096
    cpu:         1
    id:          19
    networks:    [management, services]
    netaddr:     auto
    disks:       [8]
  - hostname:    "deployment"
    domain:      "wrx.sckt.net"
    ram:         4096
    cpu:         1
    id:          24
    networks:    [management, controlplane, storage0]
    netaddr:     auto
    disks:       [8]
    airgapped:   true
  - hostname:    "recorder"
    domain:      "wrx.sckt.net"
    ram:         4096
    cpu:         1
    id:          25
    networks:    [management, services]
    netaddr:     auto
    disks:       [8]
    airgapped:   true
  ############################################################################
  #  openstack controller
  ############################################################################
  - hostname:    "controller01"
    domain:      "os.wrx.sckt.net"
    ram:         12288
    cpu:         6
    id:          32
    networks:    [management, storage0, controlplane, dataplane, lbmanagement, services]
    netaddr:     auto
    disks:       [64]
    airgapped:   true
  - hostname:    "controller02"
    domain:      "os.wrx.sckt.net"
    ram:         12288
    cpu:         6
    id:          33
    networks:    [management, storage0, controlplane, dataplane, lbmanagement, services]
    netaddr:     auto
    disks:       [64]
    airgapped:   true
  - hostname:    "controller03"
    domain:      "os.wrx.sckt.net"
    ram:         12288
    cpu:         6
    id:          34
    networks:    [management, storage0, controlplane, dataplane, lbmanagement, services]
    netaddr:     auto
    disks:       [64]
    airgapped:   true
  # id: 35 - > HA
  ############################################################################
  #  openstack network
  ############################################################################
  - hostname:    "network01"
    domain:      "os.wrx.sckt.net"
    ram:         8192
    cpu:         2
    id:          40
    networks:    [management, controlplane, dataplane, external, lbmanagement, public]
    netaddr:
      external:
      public:
    disks:       [16]
    airgapped:   true
  - hostname:    "network02"
    domain:      "os.wrx.sckt.net"
