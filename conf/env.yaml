---
# Network Layout

# ID Allacation
# 0-15    - network
# 16-31   - infra
# 32-128  - openstack
# 128-160 - ceph


##############################################################################
resolve_conf:
  nameservers:
    - 10.14.0.10
  searchdomains: []
##############################################################################
network_conf:
  ############################################################################
  # Public -> Intranet
  ############################################################################
  public:
    iface:       pblc0
    bridgename:  vimbr0
    addr:        10.10.61.0/24
    netmask:     255.255.255.0
    gateway:     10.10.61.1/24
    nameservers: [10.10.11.99]
  ############################################################################
  # Infra
  ############################################################################
  management:
    iface:   mgmt0
    addr:    10.14.0.0/24
  services:
    iface:   srvc0
    addr:    10.34.10.0/24
  ############################################################################
  # openstack
  ############################################################################
  controlplane:
    iface:   cpln0
    addr:    10.20.8.0/24
    domain:  os.wrx.sckt.net
  dataplane:
    iface:   dpln0
    addr:    10.20.9.0/24
  lbmanagement:
    iface:   lmgt0
    addr:    10.20.15.0/24
  external:
    # multiple vlans can be used within this interface (trunk mode)
    iface:   xtrn0
    addr:
  ############################################################################
  # ceph
  ############################################################################
  storage0:
    iface:   strg0
    addr:    10.20.21.0/24
    domain:  strg.wrx.sckt.net
  storage1:
    iface:   strg1
    addr:    10.20.22.0/24

##############################################################################
openstack_network_conf:
  ############################################################################
  # external(vlan)
  ############################################################################
  # public:
  # # flat network
  #   iface:   pblc0
  #   # TODO:  reserve block of 8 ip addresses for each participant
  #   addr:    10.10.61.$((160 8*$(hostname -s | sed -r -e "s/^[^0-9]+//") ))/29
  # # vlan networks
  shared3010:
    addr:    10.30.10.0/24
    vlan:    3010
  shared3011:
    addr:    10.30.11.0/24
    vlan:    3011
  shared3012:
    addr:    10.30.12.0/24
    vlan:    3012
##############################################################################
server_conf:
  - hostname:    "dns"
    domain:      "wrx.sckt.net"
    ram:         4096
    cpu:         1
    id:          10
    networks:    [management, services]
    netaddr:     auto
    disks:       [8]
    proxy:       yes
  - hostname:    "registry"
    domain:      "wrx.sckt.net"
    ram:         4096
    cpu:         1
    id:          17
    networks:    [management, services]
    netaddr:     auto
    disks:       [128]
