---
# TODO
# https://osism.tech/docs/release-notes/osism-7
# osism 7.1.2 (2024-08-18) -> OpenStack 2023.2, grafana: 11.2.0
# osism 6.0.2              -> Openstack 2023.1, grafana: 11.2.0
# Gilt Docs: https://retr0h.github.io/gilt/configuration
repositories:
  - git: https://github.com/osism/kolla-operations.git
    # version: v0.20240319.0
    # version: v0.20230407.0 # debugged, working
    # version: v0.20240204.0 # working
    # version: v0.20240221.0 # working
    # version: v0.20240524.0 # broken
    # version: v0.20240818.0 # broken
    version: v0.20240221.0
    sources:
      - src: "prometheus"
        dstDir: custom-config/wrx/config/prometheus
      - src: "grafana"
        dstDir: custom-config/wrx/config/grafana
    commands:
      # Patch openstack dahsboard
      - cmd: /usr/bin/sed
        args:
         - -e
         - "s/[$]{DS_PROMETHEUS}/Prometheus/"
         - -i
         - custom-config/wrx/config/grafana/dashboards/openstack/openstack.json
      # haproxy dashboard does not work with native haproxy exporter, we need another one
      # haproxy rules are obsolete due to change from external to embedded exporter
      - cmd: /usr/bin/rm
        args:
         - custom-config/wrx/config/grafana/dashboards/infrastructure/haproxy.json
         - custom-config/wrx/config/prometheus/haproxy.rules
      # Patch alermanager config to enable telegram notifications
      # https://velenux.wordpress.com/2022/09/12/how-to-configure-prometheus-alertmanager-to-send-alerts-to-telegram/$
      - cmd: /usr/bin/sed
        args:
         - '/^receivers:/,$d'
         - -i
         - custom-config/wrx/config/prometheus/prometheus-alertmanager.yml
      - cmd: /usr/bin/sed
        args:
         - "$ a\\  routes:\\n  - receiver: 'telegram'\\n    group_wait: 10s\\n    matchers:\\n    - env = 'wrx'"
         - -i
         - custom-config/wrx/config/prometheus/prometheus-alertmanager.yml
      - cmd: /usr/bin/sed
        args:
         - "$ a receivers:\\n  - name: default-receiver\\n  - name: 'telegram'\\n    telegram_configs:\\n    - bot_token: 6642010552:AAFVqKzF2G9ySQskMgOOSXq_eR5SwoA09F0\\n      api_url: https://api.telegram.org\\n      chat_id: -1002148282209\\n      parse_mode: ''\\n"
         - -i
         - custom-config/wrx/config/prometheus/prometheus-alertmanager.yml
      # remove conf files, we can not utilize
      - cmd: /usr/bin/rm
        args: 
          - custom-config/wrx/config/prometheus/prometheus.yml.d/51-ceph-nodeexporter.yml
          - custom-config/wrx/config/prometheus/prometheus.yml.d/50-ceph.yml
          - custom-config/wrx/config/prometheus/prometheus.yml.d/60-fluentd-aggregator.yml
      - cmd: /usr/bin/find
        args: 
          - custom-config/wrx/config/grafana/dashboards/ceph/
          - -not
          - '('
          - -regex
          - ".*/ceph-cluster.*"
          - -o
          - -regex
          - ".*/hosts-overview.*"
          - ')'
          - -type
          - f
          - -delete
      - cmd: /bin/bash
        args:
          - -c
          - |
            cat > custom-config/wrx/config/prometheus/prometheus.yml.d/70-blackbox-exporter-customer-router-liveness-icmp.yml <<EOF
            scrape_configs:
            - job_name: 'customer_router_liveness_icmp'
              metrics_path: /probe
              params:
                module: [icmp]
              scrape_interval: 1s
              scrape_timeout:  1s
              static_configs:
            {% for item in prometheus_d_conf.blackbox_exporter.customer_router %}
                - targets:
                  - {{item.ip}}
                  labels:
                    name: {{item.name}}
            {% endfor %}
              relabel_configs:
                - source_labels: [__address__]
                  target_label: __param_target
                - source_labels: [__param_target]
                  target_label: instance
                - target_label: __address__
                  replacement: "{{ api_interface_address | put_address_in_context('url') }}:{{ prometheus_blackbox_exporter_port }}"
            EOF
      - cmd: /bin/bash
        args:
          - -c
          - |
            cat > custom-config/wrx/config/prometheus/prometheus.yml.d/10-redfish.yml <<EOF
            {% if groups.get('redfish') %}
            scrape_configs:
              - job_name: redfish-exporter
                metrics_path: /redfish
                scrape_timeout: 300s
                scrape_interval: 10m
                relabel_configs:
                 - source_labels: [__address__]
                   target_label: __param_target
                 - source_labels: [__param_target]
                   target_label: instance
                 - target_label: __address__
                   ### the address of the redfish-exporter address
                   replacement: "{{ groups['monitoring'][0] }}:9610"
                static_configs:
            {% for host in groups.get('redfish', []) %}
                  - targets:
                      - '10.40.11.{{ hostvars[host]["ansible_facts"]["default_ipv4"]["address"].split(".")[3] }}'
                    labels:
                      server: '{{hostvars[host]["inventory_hostname"].split(".")[0]}}'
                      env:    '{{env_name}}'
            {% endfor %}
            {% endif %}
            EOF
  # 1 Node Exporter
  - git: https://github.com/starsliao/Prometheus.git
    version: d6b2d5e0cbadb5305c5673a63f6bf3237a51cb3f
    sources:
      - src:    dummy
        dstDir: dummy
        #dstDir: custom-config/wrx/config/grafana/dashboards/openstack/
    commands:
      - cmd: curl
        args:
          - -sS
          - -o
          - custom-config/wrx/config/grafana/dashboards/infrastructure/1_node_exporter.json
          - https://grafana.com/api/dashboards/11074/revisions/9/download
      - cmd: /usr/bin/sed
        args:
         - -e
         - "s/[$]{DS__VICTORIAMETRICS}/Prometheus/"
         - -i
         - custom-config/wrx/config/grafana/dashboards/infrastructure/1_node_exporter.json
  #
  # Blackbox Exporter ICMP
  #
  - git: https://github.com/M0NsTeRRR/grafana-dashboards.git
    version: 3143973f88155578760a84d25a16639c8edda067
    sources:
      - src:    dashboards/blackbox_exporter_icmp.json
        dstDir: custom-config/wrx/config/grafana/dashboards/openstack/
    commands:
      - cmd: /usr/bin/sed
        args:
         - -e
         - "s/[$]{DS_PROMETHEUS}/Prometheus/"
         - -i
         - custom-config/wrx/config/grafana/dashboards/openstack/blackbox_exporter_icmp.json
      - cmd: /usr/bin/sed
        args:
         - -re
         - 's/(\{\{instance\}\})/{{name}}(\1)/'
         - -i
         - custom-config/wrx/config/grafana/dashboards/openstack/blackbox_exporter_icmp.json
      - cmd: /usr/bin/sed
        args:
          - -re
          - 's/(sum[(]probe_icmp_duration_seconds.*instance)[)]/\1,name)/'
          - -i
          - custom-config/wrx/config/grafana/dashboards/openstack/blackbox_exporter_icmp.json
  #
  # Haproxy
  #
  # Dashboard
  - git: https://github.com/rfmoz/grafana-dashboards.git
    version: fb8ab3ec1444622f76ffc64162e193623e082062
    sources:
      - src:    prometheus/haproxy.json
        dstDir: custom-config/wrx/config/grafana/dashboards/infrastructure/
    commands:
      - cmd: /usr/bin/sed
        args:
         - -e
         - "s/[$]{DS_PROMETHEUS}/Prometheus/"
         - -i
         - custom-config/wrx/config/grafana/dashboards/infrastructure/haproxy.json
  # Rules
  - git: https://github.com/samber/awesome-prometheus-alerts.git
    version: 2025-04-17.1
    sources:
      - src:    dist/rules/haproxy/embedded-exporter-v2.yml
        dstFile: custom-config/wrx/config/prometheus/haproxy.rules
