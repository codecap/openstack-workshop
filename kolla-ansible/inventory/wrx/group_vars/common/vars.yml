---
#
# Kolla
#
kolla_internal_vip_address: "10.20.8.35"
kolla_external_vip_address: "10.34.10.35"

#
# Ceph
#
ceph_rgw_hosts:
  - { host: cephmon01.strg.wrx.sckt.net, ip: 10.20.21.128, port: 8080 }
  - { host: cephmon02.strg.wrx.sckt.net, ip: 10.20.21.129, port: 8080 }
  - { host: cephmon03.strg.wrx.sckt.net, ip: 10.20.21.130, port: 8080 }
ceph_cluster_fsid:      "1959570b-e2e3-4017-a5dc-c7606c5068fd"
ceph_rgw_internal_fqdn: "s3.storage.wrx.sckt.net"
ceph_rgw_port:          "80"

#
# Networking
#
network_interface:            "{{network_conf.ifaces.default}}"
api_interface:                "{{network_conf.ifaces.api}}"
dns_interface:                "{{network_conf.ifaces.default}}"
ironic_tftp_interface:        "{{network_conf.ifaces.ironic}}"
ironic_http_interface:        "{{network_conf.ifaces.ironic}}"
octavia_network_interface:    "{{network_conf.ifaces.octavia}}"
storage_interface:            "{{network_conf.ifaces.storage}}"
tunnel_interface:             "{{network_conf.ifaces.tunnel}}"
kolla_external_vip_interface: "{{network_conf.ifaces.external}}"

#
# Monitoring
#
prometheus_instance_label: "{{ ansible_facts.hostname }}"

#
# Neutron
#
neutron_bridge_name:         "br-pblc0,br-lmgt0,br-ex0"
neutron_external_interface:  "pblc0,lmgt0,xtrn0"
neutron_dnsmasq_dns_servers: "10.14.0.10"
ml2_network_vlan_ranges:
  br-irnc0: "3890:3899"

mechanism_drivers:
#   - name: "genericswitch"
#     enabled: "{{ enable_neutron_genericswitch | bool }}"
  - name: "linuxbridge"
    enabled: "{{ neutron_plugin_agent == 'linuxbridge' }}"
  - name: "openvswitch"
    enabled: "{{ neutron_plugin_agent == 'openvswitch' }}"
  - name: "mlnx_infiniband"
    enabled: "{{ enable_neutron_mlnx | bool }}"
  - name: "baremetal"
    enabled: "{{ enable_ironic_neutron_agent | bool }}"
  - name: "l2population"
    enabled: "{{ neutron_plugin_agent != 'ovn' }}"
  - name: "ovn"
    enabled: "{{ neutron_plugin_agent == 'ovn' }}"
  - name: "sriovnicswitch"
    enabled: "{{ enable_neutron_sriov | bool }}"

#
# Ironic
#
ironic_dnsmasq_dhcp_ranges:
  - range: "10.38.90.240,10.38.90.254,255.255.255.0"
ironic_cleaning_network:     "ironic-provisioning"

#
# Octavia
#
octavia_network_type:                 provider
octavia_amp_network_cidr:             "10.20.15.0/24"
octavia_certs_server_ca_common_name:  server-ca.wrx.sckt.net
octavia_certs_client_ca_common_name:  client-ca.wrx.sckt.net
octavia_certs_client_req_common_name: client.wrx.sckt.net
octavia_amp_network:
  name: lb-mgmt-net
  provider_network_type: flat
  provider_physical_network: "physnet{{neutron_external_interface.split(',').index('lmgt0')+1}}"
  external: false
  shared:   false
  subnet:
    name: lb-mgmt-subnet
    cidr:                  "{{ octavia_amp_network_cidr }}"
    allocation_pool_start: "10.20.15.192"
    allocation_pool_end:   "10.20.15.254"
    no_gateway_ip:         yes
    enable_dhcp:           yes
#
# Designate
#
designate_ns_record:
  - "dns.wrx.sckt.net"
