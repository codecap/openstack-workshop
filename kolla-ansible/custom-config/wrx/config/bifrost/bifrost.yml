---
ansible_python_interpreter: /var/lib/kolla/venv/bin/python
enabled_hardware_types: "ipmi"
# enabled_deploy_interfaces: "direct,ramdisk,anaconda"
cleaning: false
#network_interface: "mgmt0"
network_interface: "{{network_interface}}"
mysql_username: "root"
mysql_password:
dhcp_provider: "none"
#default_boot_mode: "uefi"
use_firewalld: false
# firewalld_internal_zone: public

# enable_prometheus_exporter: true
dhcp_pool_start:     "10.14.0.240"
dhcp_pool_end:       "10.14.0.254"
dhcp_lease_time: 2h
dhcp_static_mask:    "255.255.255.0"
dnsmasq_router:      "10.14.0.1"
dnsmasq_enable_dns:  true
dnsmasq_dns_servers: "10.14.0.10"
#dnsmasq_ntp_servers: "10.40.10.10"

ssh_public_key_path: /etc/bifrost/id_rsa.pub
