[DEFAULT]
default_boot_interface = ipxe
enabled_boot_interfaces = ipxe,pxe

[deploy]
default_boot_mode = uefi
# we are using only erase_devices_metadata
erase_devices_priority=0
erase_devices_express_priority=0

[conductor]
# docs: https://docs.openstack.org/ironic/latest/admin/cleaning.html
automated_clean = true
# Erasing by destroying the metadata, fast data destruction
clean_step_priority_override=deploy.erase_devices_metadata:10

[pxe]
# changed from pxe_append_params to kernel_append_params in zed release
# rootpw: 1234
kernel_append_params = nofb nomodeset vga=normal console=tty0 console=ttyS0,{{ ironic_console_serial_speed }} systemd.journald.forward_to_console=yes ipa-insecure=1 ipa-debug=True rootpwd="$$1$$PwHpiRbr$$bq5fe8F5gASpF8tEPZ7kP0"
# default undionly.kpxe not working with rx2530 (and TianoCore / qemu)
ipxe_bootfile_name = ipxe.efi
uefi_ipxe_bootfile_name = ipxe.efi
